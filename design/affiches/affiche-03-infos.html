<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
  <link rel="stylesheet" href="affiches.css" />
  <style>
    .kicker { margin-top: 56px; }
    h1.display { margin-top: 22px; font-size: 150px; line-height: 1.02; }
    h1 .marker { color: var(--bone); text-transform: none; font-size: 0.78em; display: inline-block; transform: rotate(-4deg); }

    .ticket {
      margin-top: 60px;
      display: flex;
      background: var(--ink);
      color: var(--bone);
    }
    .ticket .main { flex: 1; padding: 48px 44px; }
    .ticket .stub {
      width: 330px;
      padding: 40px 36px;
      border-left: 3px dashed rgba(242, 232, 213, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 32px; }
    .rows .label { font-size: 15px; color: var(--blood); }
    .rows .value { font-size: 46px; margin-top: 10px; white-space: nowrap; }
    .rows .wide { grid-column: span 2; }
    .price { font-size: 84px; color: var(--blood); white-space: nowrap; }
    .places { font-size: 22px; font-weight: 700; margin-top: 10px; }

    .book {
      margin-top: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .book .label { font-size: 17px; }
    .book .phone { font-size: 64px; margin-top: 10px; }
    .dress {
      text-align: right;
      font-size: 34px;
      line-height: 1.15;
      transform: rotate(-3deg);
      color: var(--bone);
      max-width: 330px;
    }
  </style>
</head>
<body>
  <div class="poster blood">
    <div class="top">
      <img class="logo" src="../../public/brand/logo-flemmard-club.png" alt="" />
      <span class="mono">Halloween — 03/03</span>
    </div>

    <p class="mono kicker">Infos &amp; réservation</p>
    <h1 class="display">Tu viens ou<br />tu <span class="marker">flemmes</span>&nbsp;?</h1>

    <div class="ticket">
      <div class="main">
        <div class="rows">
          <div><p class="mono label">Date</p><p class="display value">Sam. 31 oct.</p></div>
          <div><p class="mono label">Heure</p><p class="display value">Dès 18h</p></div>
          <div class="wide"><p class="mono label">Lieu</p><p class="display value">Le Yao, Akpakpa-Centre</p></div>
        </div>
      </div>
      <div class="stub">
        <p class="mono label" style="font-size:15px;color:var(--blood)">Ticket</p>
        <div>
          <p class="display price">5 000 F</p>
          <p class="places">30 places seulement</p>
        </div>
      </div>
    </div>

    <div class="book">
      <div>
        <p class="mono label">Réserve sur WhatsApp</p>
        <p class="display phone">+229 01 91 31 93 57</p>
      </div>
      <p class="marker dress">Viens en ton artiste préféré !</p>
    </div>

    <div class="bottom">
      <span class="mono">Music by Big H</span>
      <svg class="crown" viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24.5 3.5 7.5l9 8.2L19.8 3l6.6 12.4 9.6-8.6-2.1 17.9"/><path d="M4.5 27.5c9.5-1.6 20.2-1.9 30.4-.6"/></svg>
    </div>
  </div>
</body>
</html>
