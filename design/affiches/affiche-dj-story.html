<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="poster-size" content="1080x1920" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@700&family=Permanent+Marker&display=block" rel="stylesheet">
  <link rel="stylesheet" href="affiches.css" />
  <style>
    html, body, .poster { width: 1080px; height: 1920px; }
    .poster { background: var(--night); }

    .logo { top: 54px; left: 50%; height: 96px; transform: translateX(-50%) rotate(-4deg); }

    .who { top: 166px; left: 0; right: 0; text-align: center; }
    .who .by { font-size: 84px; color: var(--red); transform: rotate(-5deg); display: inline-block; }
    .who .name { font-size: 290px; color: var(--cream); margin-top: -6px; }

    .dj { left: 50%; bottom: 520px; height: 920px; transform: translateX(-46%); z-index: 3; }

    .ribbons { top: 1290px; left: 0; right: 0; text-align: center; z-index: 4; }
    .ribbons .ribbon { font-size: 62px; transform: rotate(-3deg); padding: 10px 60px 6px 64px; }

    .foot { left: 0; right: 0; bottom: 0; height: 520px; z-index: 2; text-align: center; padding-top: 120px; }
    .foot .event { color: var(--ink); }
    .foot .event .l1 { font-size: 150px; }
    .foot .event .l2 { font-size: 72px; }
    .foot .meta { font-size: 26px; color: var(--cream); margin-top: 22px; line-height: 1.8; }
    .foot .meta b { color: var(--ink); }
    .foot .cta { font-size: 64px; color: var(--cream); margin-top: 14px; }
  </style>
</head>
<body>
  <div class="poster">
    <svg class="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <!-- Toiles d'araignée -->
      <g id="webs" fill="none" stroke="#f5e5a1" stroke-width="3" stroke-linecap="round"></g>
      <!-- Soleil couchant derrière le DJ -->
      <circle cx="540" cy="900" r="420" fill="#ee5223" />
      <circle cx="540" cy="900" r="340" fill="#f4a62a" opacity="0.35" />
      <g id="birds" fill="#f7d9c6"></g>
      <!-- Sol rouge -->
      <path fill="#ee3924" d="M0 1420 L300 1396 L620 1410 L1080 1388 V1920 H0Z" />
      <g id="bats" fill="#050a10"></g>
    </svg>

    <img class="layer logo" src="../../public/brand/logo-flemmard-club.png" alt="" />

    <div class="layer who anton">
      <span class="marker by">Music by</span>
      <p><span class="sliced name">Big H</span></p>
    </div>

    <img class="layer dj" src="src/big-h-cutout.png" alt="" />

    <div class="layer ribbons anton">
      <span class="ribbon">Frissons, beats &amp; bonne énergie !</span>
    </div>

    <div class="layer foot">
      <div class="anton event">
        <div><span class="sliced l1">Halloween</span></div>
        <div><span class="sliced l2">Special Edition</span></div>
      </div>
      <p class="mono meta">Sam. 31 oct. · <b>dès 18h</b> · Le Yao, Akpakpa-Centre<br /><b>5 000 F</b> · 30 places seulement</p>
      <p class="marker cta">Réserve vite ta place !</p>
    </div>
  </div>

  <script src="slice.js"></script>
  <script src="decor.js"></script>
  <script>
    web('webs', -10, -10, 1, 0.9)
    web('webs', 1090, -10, -1, 0.9)
    scatter('birds', BIRD, [[170, 760, 1.2, -10], [230, 810, 0.7, 6], [840, 700, 1.3, 12], [900, 770, 0.8, -6]])
    scatter('bats', BAT, [[40, 1450, 0.6, -10], [900, 1440, 0.55, 12]])
  </script>
</body>
</html>
