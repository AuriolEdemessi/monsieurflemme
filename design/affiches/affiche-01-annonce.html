<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
  <link rel="stylesheet" href="affiches.css" />
  <style>
    .visual {
      position: absolute;
      right: -30px;
      top: 400px;
      width: 720px;
      height: 720px;
    }
    .sun {
      position: absolute;
      inset: 70px 40px 90px 100px;
      border-radius: 50%;
      background: var(--blood);
    }
    .visual img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .presents { margin-top: 56px; }
    h1 {
      margin-top: 22px;
      font-size: 214px;
      position: relative;
      z-index: 2;
    }
    .edition {
      position: relative;
      z-index: 2;
      font-size: 78px;
      color: var(--blood);
      transform: rotate(-4deg);
      margin: -6px 0 0 6px;
      display: inline-block;
    }
    .side {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: 44px;
      width: 360px;
    }
    .side .line { padding: 20px 0; border-top: 2px solid rgba(242, 232, 213, 0.2); }
    .side .value { font-size: 52px; margin-top: 8px; }
    .musicby { font-size: 40px; color: var(--blood); transform: rotate(-4deg); display: inline-block; }
    .bigh { font-size: 120px; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="poster ink">
    <div class="top">
      <img class="logo" src="../../public/brand/logo-flemmard-club.png" alt="" />
      <span class="mono">Halloween — 01/03</span>
    </div>

    <p class="mono presents dim">Flemmard Club présente</p>
    <h1 class="display">Halloween</h1>
    <div><span class="marker edition">Special Edition</span></div>

    <div class="visual">
      <div class="sun"></div>
      <img src="../../public/events/halloween/pumpkin.webp" alt="" />
    </div>

    <div class="side">
      <div class="line">
        <p class="mono red">Quand</p>
        <p class="display value">Sam. 31 oct.</p>
      </div>
      <div class="line">
        <p class="mono red">Heure</p>
        <p class="display value">Dès 18h</p>
      </div>
      <div class="line">
        <span class="marker musicby">Music by</span>
        <p class="display bigh">Big H</p>
      </div>
    </div>

    <div class="bottom">
      <span class="mono">Le Yao — Akpakpa-Centre</span>
      <svg class="crown" viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24.5 3.5 7.5l9 8.2L19.8 3l6.6 12.4 9.6-8.6-2.1 17.9"/><path d="M4.5 27.5c9.5-1.6 20.2-1.9 30.4-.6"/></svg>
    </div>
  </div>
</body>
</html>
